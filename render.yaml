services:
  - type: web
    name: cohub-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn cohub_settings.wsgi:application --bind 0.0.0.0:$PORT
    # Деплой запускается из GitHub Actions (deploy.yml) только после зелёного CI,
    # поэтому собственный авто-деплой Render отключён, чтобы не было двойного деплоя.
    autoDeploy: false
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"
      - key: DJANGO_SECRET_KEY
        generateValue: true

  - type: cron
    name: cohub-backup-daily
    env: python
    plan: free
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py backup_data --compress
