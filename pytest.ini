[pytest]
DJANGO_SETTINGS_MODULE = cohub_settings.settings
python_files = tests.py test_*.py *_tests.py
# Покрытие меряем по коду приложения (cohub_app); настройки/миграции/тесты
# исключены в .coveragerc. Порог ≥70% — требование чек-листа.
addopts = -v --cov=cohub_app --cov-report=term-missing --cov-report=html --cov-fail-under=70
