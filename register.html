<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cohub - Join</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">

        <div class="glass-container">

            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="logo">COHUB</div>
            </aside>

            <!-- MAIN -->
            <main class="auth-main">

                <div class="auth-card">
                    <h1>JOIN COHUB</h1>

                    <form>

                        <div class="input-group">
                            <label>Полное имя</label>
                            <input type="text" placeholder=" ">
                        </div>

                        <div class="input-group">
                            <label>Электронная почта</label>
                            <input type="email" placeholder=" ">
                        </div>

                        <div class="input-group">
                            <label>Пароль</label>
                            <input type="password">
                        </div>

                        <div class="input-group">
                            <label>Подтвердите пароль</label>
                            <input type="password">
                        </div>

                        <div class="checkbox">
                            <input type="checkbox">
                            <span>Я согласен с Условиями использования и Политикой конфиденциальности</span>
                        </div>

                        <button class="btn">ЗАРЕГИСТРИРОВАТЬСЯ</button>

                        <p class="login-link">
                            Уже есть аккаунт?
                            <a href="#">Войти</a>
                        </p>

                    </form>
                </div>

            </main>

        </div>

    </div>

</body>

</html>
