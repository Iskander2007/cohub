{% extends "base.html" %}

{% block title %}LOGIN - COHUB{% endblock %}

{% block content %}
<aside class="sidebar">
    <div class="logo">COHUB</div>
    <div class="members-vertical">MEMBERS</div>
</aside>

<main class="main register-main">
    <section class="register-panel card">
        <div class="register-inner">
            <h2 class="register-title">ВОЙТИ</h2>
            {% if error %}
            <div class="error-message is-visible">{{ error }}</div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" class="register-form">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">
                <div class="input-group">
                    <label for="login-email">Адрес электронной почты</label>
                    <input id="login-email" type="email" name="email" required value="{{ email|default:'' }}"
                        placeholder="email@пример.com" title="Введите email">
                </div>
                <div class="input-group">
                    <label for="login-password">Пароль</label>
                    <input id="login-password" type="password" name="password" required placeholder="Введите пароль"
                        title="Введите пароль">
                </div>
                <div class="input-group">
                    <label for="login-captcha">{{ captcha_question }}</label>
                    <input id="login-captcha" type="text" name="captcha" inputmode="numeric" required
                        autocomplete="off" placeholder="Ответ на вопрос" title="Защита от ботов">
                </div>
                <button type="submit" class="btn register-btn">ВОЙТИ</button>
                {% if google_oauth_enabled %}
                <a href="{% url 'google-login' %}" class="btn register-btn" style="display:block;text-align:center;margin-top:10px;background:#fff;color:#444;border:1px solid #ccc;text-decoration:none;">
                    Войти через Google
                </a>
                {% endif %}
                <p class="login-link">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрируйтесь</a></p>
            </form>
        </div>
    </section>
</main>

{% endblock %}
