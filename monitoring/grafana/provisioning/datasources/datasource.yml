# Grafana автоматически подключает Prometheus как источник данных при старте.
# uid фиксирован (`prometheus`) — на него ссылается дашборд cohub-golden-signals.json,
# поэтому импорт работает «из коробки», без ручного выбора датасорса.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
