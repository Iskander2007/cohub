# Alertmanager: маршрутизация и доставка алертов COHUB.
#
# Получает сработавшие алерты от Prometheus и раскладывает их по приёмникам
# (receivers) в зависимости от severity/team. Реальные вебхуки Slack и SMTP
# вынесены в переменные-заглушки — впишите свои значения перед продакшеном.

global:
  resolve_timeout: 5m
  # SMTP для email-уведомлений (заполните под свой почтовый сервер).
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@cohub.dev'
  # smtp_auth_username: 'alerts@cohub.dev'
  # smtp_auth_password: 'app-password'

# Шаблон дерева маршрутизации: общий приёмник + ветки по командам/severity.
route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s        # подождать перед первой отправкой группы
  group_interval: 5m     # как часто досылать обновления группы
  repeat_interval: 4h    # как часто повторять неразрешённый алерт
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h
    - matchers:
        - team = "payments"
      receiver: payments
    - matchers:
        - team = "infrastructure"
      receiver: infrastructure

# Подавление шумных алертов: если сервер лежит (critical), не спамить
# производными warning'ами того же инстанса.
inhibit_rules:
  - source_matchers: [ 'alertname = "CohubServerDown"' ]
    target_matchers: [ 'severity =~ "warning|info"' ]
    equal: ['instance']

receivers:
  - name: default
